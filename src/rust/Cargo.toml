[package]
name = "flatgeobuf"
version = "4.0.0"
authors = ["Pirmin Kalberer <pka@sourcepole.ch>"]
edition = "2021"
description = "FlatGeobuf for Rust"
homepage = "https://flatgeobuf.org/"
repository = "https://github.com/flatgeobuf/flatgeobuf/tree/master/src/rust"
readme = "README.md"
documentation = "https://docs.rs/flatgeobuf/"
license = "BSD-2-Clause"
keywords = ["geo", "r-tree", "spatial"]

[features]
default = ["http"]
http = ["http-range-client", "bytes", "streaming-http-range-client"]

[dependencies]
flatbuffers = "23.5.26"
byteorder = "1.4.3"
geozero = { version = "0.11.0", default-features = false }
http-range-client = { version = "0.7.1", optional = true }
streaming-http-range-client = { path = "../../../streaming_http_range_client", optional = true }
bytes = { version = "1.4.0", optional = true }
log = "0.4.19"
fallible-streaming-iterator = "0.1.9"
tempfile = "3.7.1"
reqwest = { version = "0.11.18", features = ["stream"] }
futures-util = "0.3.28"
tokio-util = { version = "0.7.8", features = ["io"] }
async-trait = "0.1.73"
tokio = { version = "1.30.0", default-features = false }
async-stream = "0.3.5"

[dev-dependencies]
env_logger = "0.10.0"
geozero = { version = "0.11.0", default-features = true }
seek_bufread = "1.2.2"
rand = "0.8.5"
hex = "0.4.3"
criterion = { version = "0.5.1", features = ["async_tokio"] }
# tokio = { version = "1.30.0", features = ["rt-multi-thread"] }
# One test needs SSL support; just use the default system bindings for that.
reqwest = { version = "0.11.18", default-features = true }
geo-types = "0.7.11"
yocalhost = "0.3.0"

[[bench]]
name = "read"
harness = false

[[bench]]
name = "http_read"
harness = false

[[bench]]
name = "geojson"
harness = false

#[patch.crates-io]
# Patch geozero dependencies (dev only)
#geozero = { path = "../../../../rust/geozero/geozero" }

[package.metadata.docs.rs]
all-features = true
